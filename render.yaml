services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: meeshohub-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false   # Set this manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ENCRYPTION_IV
        value: meeshohub_iv_16ch
      - key: FRONTEND_URL
        sync: false   # Set to your Render frontend URL after deploy

  # ── Frontend ─────────────────────────────────────────────────────────────────
  - type: web
    name: meeshohub-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # Set to your Render backend URL after deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{width:340px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;color:#1e293b}
    .header{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;padding:14px 16px;display:flex;align-items:center;gap:10px}
    .logo{width:36px;height:36px;background:white;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#6366f1;font-size:18px;flex-shrink:0}
    .header h1{font-size:15px;font-weight:700}
    .header p{font-size:11px;opacity:0.85;margin-top:1px}
    .body{padding:14px}
    .card{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:10px}
    .card-title{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
    .input{width:100%;padding:8px 10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:12px;outline:none;transition:.2s}
    .input:focus{border-color:#6366f1}
    .input+.input{margin-top:6px}
    .btn{width:100%;padding:10px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
    .btn-primary{background:#6366f1;color:white}
    .btn-primary:hover:not(:disabled){background:#4f46e5}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed}
    .btn-green{background:#059669;color:white;margin-top:8px}
    .btn-green:hover:not(:disabled){background:#047857}
    .btn-green:disabled{opacity:.5;cursor:not-allowed}
    .btn-outline{background:white;color:#6366f1;border:1.5px solid #6366f1;margin-top:8px}
    .btn-outline:hover{background:#eef2ff}
    .btn-danger{background:white;color:#ef4444;border:1.5px solid #ef4444;margin-top:6px;font-size:12px;padding:8px}
    .btn-danger:hover{background:#fef2f2}
    .status-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f1f5f9}
    .status-row:last-child{border:none}
    .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .dot-green{background:#22c55e}
    .dot-red{background:#ef4444}
    .dot-yellow{background:#f59e0b;animation:blink 1s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .status-label{font-size:12px;font-weight:500;flex:1}
    .status-val{font-size:11px;color:#64748b}
    .progress-bar{height:6px;background:#e2e8f0;border-radius:3px;margin:8px 0;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);border-radius:3px;transition:width .4s}
    .log-box{background:#0f172a;border-radius:8px;padding:10px;max-height:130px;overflow-y:auto;margin-top:8px}
    .log-line{font-family:monospace;font-size:10.5px;line-height:1.7;color:#94a3b8}
    .log-line.success{color:#4ade80}
    .log-line.error{color:#f87171}
    .log-line.info{color:#60a5fa}
    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px;text-align:center}
    .stat-num{font-size:22px;font-weight:800;color:#6366f1}
    .stat-lbl{font-size:10px;color:#94a3b8;margin-top:2px;font-weight:500}
    .account-select{width:100%;padding:8px 10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:12px;outline:none;background:white;cursor:pointer}
    .account-select:focus{border-color:#6366f1}
    .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600}
    .badge-green{background:#dcfce7;color:#15803d}
    .badge-yellow{background:#fef9c3;color:#a16207}
    .info-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px;font-size:11px;color:#1d4ed8;line-height:1.6;margin-bottom:10px}
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">M</div>
    <div>
      <h1>MeeshoHub Sync</h1>
      <p>Meesho Supplier Panel → Dashboard</p>
    </div>
  </div>
  <div class="body" id="body">
    <p style="text-align:center;padding:20px;color:#94a3b8;font-size:12px">Loading…</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>

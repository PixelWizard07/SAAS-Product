<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; }
    .header { background: #6366f1; color: white; padding: 16px; display: flex; align-items: center; gap: 10px; }
    .header .logo { width: 32px; height: 32px; background: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #6366f1; font-size: 16px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header p { font-size: 11px; opacity: 0.8; }
    .content { padding: 16px; }
    .status-card { background: white; border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
    .status-card .label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    .status-card .value { font-size: 13px; font-weight: 600; color: #1e293b; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot-green { background: #22c55e; }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .section { margin-bottom: 12px; }
    .section-title { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .input { width: 100%; padding: 8px 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 12px; outline: none; background: white; }
    .input:focus { border-color: #6366f1; }
    .btn { width: 100%; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: #6366f1; color: white; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }
    .btn-outline { background: white; color: #6366f1; border: 1px solid #6366f1; margin-top: 8px; }
    .btn-outline:hover { background: #eef2ff; }
    .log { background: #0f172a; border-radius: 8px; padding: 10px; max-height: 120px; overflow-y: auto; margin-top: 8px; }
    .log p { font-family: monospace; font-size: 11px; color: #94a3b8; line-height: 1.6; }
    .log p.success { color: #4ade80; }
    .log p.error { color: #f87171; }
    .log p.info { color: #60a5fa; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .stat { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; text-align: center; }
    .stat .num { font-size: 20px; font-weight: 700; color: #6366f1; }
    .stat .lbl { font-size: 10px; color: #94a3b8; margin-top: 2px; }
    .not-meesho { text-align: center; padding: 20px; color: #64748b; font-size: 12px; }
    .not-meesho .icon { font-size: 32px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">M</div>
    <div>
      <h1>MeeshoHub Sync</h1>
      <p>Meesho Supplier Panel Connector</p>
    </div>
  </div>
  <div class="content" id="content">
    <p style="text-align:center;padding:20px;color:#94a3b8;font-size:12px;">Loading...</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>

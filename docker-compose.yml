version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: meeshohub-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: meeshohub
      MONGO_INITDB_ROOT_PASSWORD: meeshohub_secret
      MONGO_INITDB_DATABASE: meeshohub
    volumes:
      - mongo_data:/data/db
    networks:
      - meeshohub

  backend:
    build: ./backend
    container_name: meeshohub-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://meeshohub:meeshohub_secret@mongodb:27017/meeshohub?authSource=admin
    depends_on:
      - mongodb
    networks:
      - meeshohub

  frontend:
    build: ./frontend
    container_name: meeshohub-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - meeshohub

volumes:
  mongo_data:

networks:
  meeshohub:
    driver: bridge
